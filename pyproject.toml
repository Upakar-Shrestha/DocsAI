[project]
name = "ai-document"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Upakar-Shrestha", email = "upakarsth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[project.scripts]
ai-document = "app.main:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
